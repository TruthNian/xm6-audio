name: native-build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protocol and settings checks
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

  windows-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure native service, LDAC encoder and kernel drivers
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64 -DOA2DP_BUILD_DRIVERS=ON -DXM6_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build/native --config Release --parallel 2
      - name: Protocol and source format LDAC HQ encoder checks
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Recovery entry point checks without changing devices
        shell: powershell
        run: |
          ./scripts/tests/recovery.ps1
          ./scripts/tests/install-state.ps1
      - name: Package unsigned submission candidate
        shell: pwsh
        run: ./scripts/package-native.ps1 -BuildDirectory build/native -OutputDirectory out/native
      - uses: actions/upload-artifact@v4
        with:
          name: xm6-native-unsigned-x64
          path: out/native
          if-no-files-found: error
